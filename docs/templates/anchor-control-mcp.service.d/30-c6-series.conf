# Template only. DEPLOY=NO.
# Host path: /etc/systemd/system/anchor-control-mcp.service.d/30-c6-series.conf
# Exposes the C6 series tree to the MCP process read-only and points
# ANCHOR_CONTROL_MCP_C6_SERIES_DIR at that series. Does not open Line A.
# The unit lists stay within the MCP parser cap of 8 names. Observe-only
# units are still appended by the sidecar from its fixed catalog.

[Service]
ReadOnlyPaths=/var/lib/anchor-passline
Environment=ANCHOR_CONTROL_MCP_C6_SERIES_DIR=/var/lib/anchor-passline/affl-v2-official-ledger-c6
Environment=ANCHOR_CONTROL_MCP_SERVICE_UNITS=nginx.service,project-anchor-commercial-api.service,project-anchor-payment-webhook.service,project-anchor-whisper.service,project-anchor-word-converter.service,anchor-official-ledger-c6.service
Environment=ANCHOR_CONTROL_MCP_TIMER_UNITS=project-anchor-post-production-monitoring.timer,project-anchor-kraken-forward.timer,project-anchor-jev-forward-shadow-v2.timer,anchor-official-ledger.timer,anchor-ledger-readonly-mirror.timer,anchor-official-ledger-c6.timer
