# EXAMPLE ONLY — do not install this file on a live host from this change.
# ANCHOR_CONTROL_MCP_V1 documents how Nginx would route the public MCP path.
# It does not change production Nginx, firewall, DNS, or deploy config.
#
# Public URL: https://<anchor-domain>/mcp
# Backend stays on loopback, matching anchor-backend/docker-compose.yml (127.0.0.1:8000).

location = /mcp {
    proxy_pass http://127.0.0.1:8000/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
}
